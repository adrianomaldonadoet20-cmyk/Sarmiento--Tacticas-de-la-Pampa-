<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sarmiento: Tácticas de La Pampa — Nivel 2</title>

    <link rel="stylesheet" href="juego2.css">
</head>

<body>

    <!-- ============================================
         PANTALLA DE PRESENTACIÓN DEL NIVEL
         ============================================ -->
    <section class="portada" id="portadaNivel" aria-label="Presentación del nivel">
        <div class="portada__fondo">
            <img class="portada__imagen" id="imgPortada" src="../RECURSOS GRAFICOS/niveldos.png" alt="Ilustración histórica del Nivel 2">
            <div class="portada__velo"></div>
        </div>

        <div class="portada__contenido">
            <p class="portada__eyebrow">Nivel 2</p>
            <h1 class="portada__titulo">Nivel 2: Emboscada en la Frontera de La Pampa (1840)</h1>
            <button class="portada__cta" id="btnIniciarNivel" type="button">INICIAR</button>
        </div>
    </section>

    <main class="combate" id="combate" aria-label="Núcleo de combate táctico" hidden>

        <button class="btn-volver" id="btnVolver" type="button" aria-haspopup="dialog" aria-controls="modalConfirmarSalida">
            <span class="btn-volver__icono" aria-hidden="true">←</span>
            <span class="btn-volver__texto">Volver</span>
        </button>

        <!-- ============================================
             PANEL LATERAL: UNIDAD DEL JUGADOR
             ============================================ -->
        <section class="panel panel--unitario" aria-label="Estado de tu unidad">
            <h2 class="panel__titulo">Unitario</h2>

            <div class="unidad-info">
                <div class="barra-vida" role="progressbar" aria-label="Vida del Unitario"
                    aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
                    <div class="barra-vida__relleno barra-vida__relleno--unitario" id="vidaJugadorRelleno"></div>
                </div>
                <span class="unidad-info__texto" id="vidaJugadorTexto">40 / 40</span>
            </div>

            <dl class="stats">
                <div class="stats__fila">
                    <dt>Daño</dt>
                    <dd id="statDanoJugador">6 – 12</dd>
                </div>
                <div class="stats__fila">
                    <dt>Defensa</dt>
                    <dd id="statDefensaJugador">2</dd>
                </div>
            </dl>
        </section>

        <!-- ============================================
             TABLERO DE COMBATE
             ============================================ -->
        <section class="tablero-contenedor">

            <header class="hud">
                <span class="hud__turno" id="hudTurno">Turno del jugador</span>
                <span class="hud__contador" id="hudContador">Turno 1</span>
            </header>

            <div class="tablero" id="tablero" role="grid" aria-label="Mapa de combate"></div>

            <div class="aviso-turno" id="avisoTurno" aria-live="polite"></div>

            <div class="banner-resultado" id="bannerResultado" hidden></div>

        </section>

        <!-- ============================================
             PANEL LATERAL: BITÁCORA / REGISTRO
             ============================================ -->
        <section class="panel panel--registro" aria-label="Registro de combate">
            <h2 class="panel__titulo">Registro</h2>
            <ul class="registro" id="registro" aria-live="polite"></ul>
        </section>

    </main>

    <!-- ============================================
         MODAL: CONFIRMACIÓN DE SALIDA
         ============================================ -->
    <div class="modal-overlay" id="modalConfirmarSalida" role="dialog" aria-modal="true"
        aria-labelledby="modalConfirmarSalidaTitulo" hidden>
        <div class="modal-caja">
            <p class="modal-caja__titulo" id="modalConfirmarSalidaTitulo">¿Salir de la partida?</p>
            <p class="modal-caja__texto">Vas a volver al inicio del nivel y perderás el progreso del combate actual.</p>
            <div class="modal-caja__acciones">
                <button class="modal-boton modal-boton--cancelar" id="btnCancelarSalida" type="button">Cancelar</button>
                <button class="modal-boton modal-boton--confirmar" id="btnConfirmarSalida" type="button">Sí, salir</button>
            </div>
        </div>
    </div>

    <script>
        // --- Selección responsive de imagen de portada (PC / Móvil) ---
        // + Fallback: prueba varias extensiones/nombres comunes.
        (function () {
            var img = document.getElementById('imgPortada');
            var carpeta = '../RECURSOS GRAFICOS/';
            var mediaMovil = window.matchMedia('(max-width: 768px)');

            var candidatos = [];
            var i = 0;

            function candidatosPara(nombreBase) {
                return [
                    carpeta + nombreBase + '.png',
                    carpeta + nombreBase + '.jpg',
                    carpeta + nombreBase + '.jpeg',
                    carpeta + nombreBase + '.webp',
                    carpeta + nombreBase + '.PNG',
                    carpeta + nombreBase + '.JPG'
                ];
            }

            function cargarImagenSegunDispositivo() {
                var nombreBase = mediaMovil.matches ? 'niveldosMOVIL' : 'niveldos';
                candidatos = candidatosPara(nombreBase);
                i = 0;
                img.style.display = '';
                img.src = candidatos[0];
            }

            img.addEventListener('error', function siguienteCandidato() {
                i++;
                if (i < candidatos.length) {
                    img.src = candidatos[i];
                } else {
                    img.style.display = 'none';
                }
            });

            cargarImagenSegunDispositivo();

            if (mediaMovil.addEventListener) {
                mediaMovil.addEventListener('change', cargarImagenSegunDispositivo);
            } else if (mediaMovil.addListener) {
                mediaMovil.addListener(cargarImagenSegunDispositivo);
            }
        })();

        // --- Modal de confirmación al tocar "Volver" durante la partida ---
        (function () {
            var btnVolver = document.getElementById('btnVolver');
            var modal = document.getElementById('modalConfirmarSalida');
            var btnCancelar = document.getElementById('btnCancelarSalida');
            var btnConfirmar = document.getElementById('btnConfirmarSalida');

            function abrirModal() {
                modal.hidden = false;
                document.body.classList.add('modal-abierto');
                btnCancelar.focus();
            }

            function cerrarModal() {
                modal.hidden = true;
                document.body.classList.remove('modal-abierto');
                btnVolver.focus();
            }

            btnVolver.addEventListener('click', abrirModal);
            btnCancelar.addEventListener('click', cerrarModal);

            btnConfirmar.addEventListener('click', function () {
                window.location.reload();
            });

            modal.addEventListener('click', function (evento) {
                if (evento.target === modal) cerrarModal();
            });

            document.addEventListener('keydown', function (evento) {
                if (evento.key === 'Escape' && !modal.hidden) cerrarModal();
            });
        })();

        // --- Transición portada -> combate (con respaldo por si la animación no dispara) ---
        (function () {
            var btn = document.getElementById('btnIniciarNivel');
            var portada = document.getElementById('portadaNivel');
            var combate = document.getElementById('combate');
            var yaHecho = false;

            function mostrarCombate() {
                if (yaHecho) return;
                yaHecho = true;
                portada.hidden = true;
                combate.hidden = false;
            }

            btn.addEventListener('click', function () {
                portada.classList.add('portada--saliendo');
                portada.addEventListener('animationend', mostrarCombate, { once: true });
                setTimeout(mostrarCombate, 450);
            });
        })();
    </script>

    <script src="instancia2.js"></script>

</body>

</html>
