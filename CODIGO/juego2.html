<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nivel 2 - El Paso de las Sierras</title>

    <link
        rel="stylesheet"
        href="juego2.css"
    >
</head>

<body>

    <!-- =========================================================
         PORTADA DEL NIVEL 2
         ========================================================= -->

    <section
        id="portadaNivel"
        class="portada"
        aria-label="Presentación del Nivel 2"
    >

        <div class="portada__fondo">

            <picture>

                <!--
                    MÓVIL
                    Esta imagen se utiliza automáticamente
                    cuando la pantalla tiene 600px o menos.
                -->
                <source
                    media="(max-width: 600px)"
                    srcset="../RECURSOS_GRÁFICOS/imgPortada2Movil.png"
                >

                <!--
                    PC / TABLET
                -->
                <img
                    id="imgPortada2"
                    class="portada__imagen"
                    src="../RECURSOS_GRÁFICOS/imgPortada2.png"
                    alt="Nivel 2: El Paso de las Sierras"
                >

            </picture>

        </div>


        <!-- =====================================================
             BOTÓN INICIAR
             ===================================================== -->

        <div class="portada__boton">

            <button
                id="btnIniciarNivel"
                class="portada__cta"
                type="button"
            >
                INICIAR
            </button>

        </div>

    </section>


    <!-- =========================================================
         JUEGO
         ========================================================= -->

    <main
        id="combate"
        class="combate"
        aria-label="Núcleo de combate táctico"
        hidden
    >

        <!-- =====================================================
             ENCABEZADO DEL JUEGO
             ===================================================== -->

        <header class="juego-header">

            <div class="juego-header__titulo">

                <span class="juego-header__nivel">
                    NIVEL 2
                </span>

                <h1>
                    El Paso de las Sierras
                </h1>

            </div>


            <div class="hud">

                <div
                    id="hudTurno"
                    class="hud__turno hud__turno--jugador"
                >
                    Turno del jugador
                </div>

                <div
                    id="hudContador"
                    class="hud__contador"
                >
                    Turno 1
                </div>

            </div>

        </header>


        <!-- =====================================================
             AVISO DE CAMBIO DE TURNO
             ===================================================== -->

        <div
            id="avisoTurno"
            class="aviso-turno"
            aria-live="polite"
        >
        </div>


        <!-- =====================================================
             CONTENEDOR PRINCIPAL
             ===================================================== -->

        <div class="juego-contenido">


            <!-- =================================================
                 TABLERO
                 ================================================= -->

            <section
                class="zona-tablero"
                aria-label="Tablero de combate"
            >

                <div
                    id="tablero"
                    class="tablero"
                    role="grid"
                    aria-label="Tablero táctico"
                >
                </div>


                <!-- =============================================
                     RESULTADO
                     ============================================= -->

                <div
                    id="bannerResultado"
                    class="banner-resultado"
                    hidden
                >
                </div>

            </section>


            <!-- =================================================
                 PANEL LATERAL
                 ================================================= -->

            <aside class="panel-juego">


                <!-- =============================================
                     INFORMACIÓN DEL JUGADOR
                     ============================================= -->

                <section class="panel panel-jugador">

                    <h2 class="panel__titulo">
                        UNITARIO
                    </h2>


                    <div class="barra-vida">

                        <div
                            id="vidaJugadorRelleno"
                            class="barra-vida__relleno"
                            style="width: 100%;"
                        >
                        </div>

                    </div>


                    <div
                        id="vidaJugadorTexto"
                        class="vida-texto"
                    >
                        40 / 40
                    </div>


                    <div class="estadisticas">

                        <div class="estadistica">

                            <span class="estadistica__etiqueta">
                                DAÑO
                            </span>

                            <span
                                id="statDanoJugador"
                                class="estadistica__valor"
                            >
                                6 – 12
                            </span>

                        </div>


                        <div class="estadistica">

                            <span class="estadistica__etiqueta">
                                DEFENSA
                            </span>

                            <span
                                id="statDefensaJugador"
                                class="estadistica__valor"
                            >
                                2
                            </span>

                        </div>

                    </div>

                </section>


                <!-- =============================================
                     OBJETIVO
                     ============================================= -->

                <section class="panel panel-objetivo">

                    <h2 class="panel__titulo">
                        OBJETIVO
                    </h2>

                    <p>
                        Mantener la posición y repeler
                        el ataque de la caballería.
                    </p>

                </section>


                <!-- =============================================
                     REGISTRO DE EVENTOS
                     ============================================= -->

                <section class="panel panel-registro">

                    <h2 class="panel__titulo">
                        REGISTRO
                    </h2>

                    <ul
                        id="registro"
                        class="registro"
                    >
                    </ul>

                </section>

            </aside>

        </div>

    </main>


    <!-- =========================================================
         MODAL DE SALIDA
         ========================================================= -->

    <div
        id="modalConfirmarSalida"
        class="modal-overlay"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalConfirmarSalidaTitulo"
        hidden
    >

        <div class="modal">

            <h2
                id="modalConfirmarSalidaTitulo"
                class="modal__titulo"
            >
                ¿Salir de la partida?
            </h2>


            <p class="modal__texto">
                ¿Seguro que querés salir del Nivel 2?
            </p>


            <div class="modal__acciones">

                <button
                    id="btnCancelarSalida"
                    class="modal__boton modal__boton--cancelar"
                    type="button"
                >
                    CANCELAR
                </button>


                <button
                    id="btnConfirmarSalida"
                    class="modal__boton modal__boton--confirmar"
                    type="button"
                >
                    SALIR
                </button>

            </div>

        </div>

    </div>


    <!-- =========================================================
         CONTROL DE LA PORTADA
         ========================================================= -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const portada =
                    document.getElementById(
                        "portadaNivel"
                    );

                const combate =
                    document.getElementById(
                        "combate"
                    );

                const botonIniciar =
                    document.getElementById(
                        "btnIniciarNivel"
                    );


                botonIniciar.addEventListener(
                    "click",
                    function () {

                        /*
                         * Evitamos que se pueda pulsar
                         * varias veces.
                         */
                        botonIniciar.disabled = true;


                        /*
                         * Comienza la transición.
                         */
                        portada.classList.add(
                            "portada--saliendo"
                        );


                        /*
                         * Después de la transición,
                         * ocultamos la portada y
                         * mostramos el juego.
                         */
                        setTimeout(
                            function () {

                                portada.hidden = true;

                                combate.hidden = false;

                            },
                            400
                        );

                    }
                );

            }
        );

    </script>


    <!-- =========================================================
         INSTANCIA DEL NIVEL 2
         ========================================================= -->

    <script src="instancia2.js"></script>

</body>

</html>
