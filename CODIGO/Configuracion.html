<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarmiento: Tácticas de la Pampa - Configuración</title>
    <link rel="stylesheet" href="Menu.css">
    <style>
        /* Estilos adicionales específicos para el formulario de ajustes */
        .contenedor-config {
            max-width: 500px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 12px;
            border: 2px solid var(--color-secundario, #8b0000);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            color: #fff;
            text-align: left;
        }

        .grupo-campo {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .grupo-campo label {
            font-weight: bold;
            font-size: 0.95rem;
            color: #e0e0e0;
        }

        .grupo-campo input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #555;
            background-color: #1e1e1e;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .grupo-campo input:focus {
            border-color: #e74c3c;
        }

        .seccion-titulo {
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
            margin-top: 20px;
            margin-bottom: 15px;
            color: #f1c40f;
            font-size: 1.1rem;
            text-transform: uppercase;
        }

        .acciones {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .acciones .boton {
            flex: 1;
            text-align: center;
            cursor: pointer;
        }
    </style>
</head>
<body class="pantalla-menu">

    <div class="contenedor-config">
        <h2 style="text-align: center; margin-top: 0;">Configuración de Partida</h2>

        <!-- AJUSTES DEL JUGADOR -->
        <div class="seccion-titulo">El Unitario (Jugador)</div>
        <div class="grupo-campo">
            <label for="vidaUnitario">Vida Máxima:</label>
            <input type="number" id="vidaUnitario" value="100" min="10" max="999">
        </div>
        <div class="grupo-campo">
            <label for="danoMinUnitario">Daño Mínimo:</label>
            <input type="number" id="danoMinUnitario" value="15" min="1" max="100">
        </div>
        <div class="grupo-campo">
            <label for="danoMaxUnitario">Daño Máximo:</label>
            <input type="number" id="danoMaxUnitario" value="25" min="1" max="100">
        </div>

        <!-- AJUSTES DEL ENEMIGO -->
        <div class="seccion-titulo">El Federal (Enemigo)</div>
        <div class="grupo-campo">
            <label for="vidaFederal">Vida Máxima:</label>
            <input type="number" id="vidaFederal" value="60" min="10" max="999">
        </div>
        <div class="grupo-campo">
            <label for="danoMinFederal">Daño Mínimo:</label>
            <input type="number" id="danoMinFederal" value="10" min="1" max="100">
        </div>
        <div class="grupo-campo">
            <label for="danoMaxFederal">Daño Máximo:</label>
            <input type="number" id="danoMaxFederal" value="18" min="1" max="100">
        </div>

        <!-- BOTONES DE ACCIÓN -->
        <div class="acciones">
            <a href="Menu.html" class="boton volver">Volver</a>
            <button class="boton jugar" onclick="guardarYJugar()">Iniciar Partida</button>
        </div>
    </div>

    <script>
        // Al cargar la pantalla, rellenamos los inputs con lo guardado previamente si existe
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem("vidaUn")) document.getElementById("vidaUnitario").value = localStorage.getItem("vidaUn");
            if (localStorage.getItem("danoMinUn")) document.getElementById("danoMinUnitario").value = localStorage.getItem("danoMinUn");
            if (localStorage.getItem("danoMaxUn")) document.getElementById("danoMaxUnitario").value = localStorage.getItem("danoMaxUn");

            if (localStorage.getItem("vidaFed")) document.getElementById("vidaFederal").value = localStorage.getItem("vidaFed");
            if (localStorage.getItem("danoMinFed")) document.getElementById("danoMinFederal").value = localStorage.getItem("danoMinFed");
            if (localStorage.getItem("danoMaxFed")) document.getElementById("danoMaxFederal").value = localStorage.getItem("danoMaxFed");
        });

        // Función que guarda los datos en LocalStorage y salta al juego
        function guardarYJugar() {
            localStorage.setItem("vidaUn", document.getElementById("vidaUnitario").value);
            localStorage.setItem("danoMinUn", document.getElementById("danoMinUnitario").value);
            localStorage.setItem("danoMaxUn", document.getElementById("danoMaxUnitario").value);

            localStorage.setItem("vidaFed", document.getElementById("vidaFederal").value);
            localStorage.setItem("danoMinFed", document.getElementById("danoMinFederal").value);
            localStorage.setItem("danoMaxFed", document.getElementById("danoMaxFederal").value);

            // Redirige directamente al tablero del juego
            window.location.href = "juego.html";
        }
    </script>
</body>
</html>
