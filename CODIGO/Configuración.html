<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarmiento: Tácticas de La Pampa — Configuración</title>
    <link rel="stylesheet" href="Configuracion.css">
</head>
<body>
    <div class="config-wrapper">
        <main class="config">
            <a href="Menu.html" class="boton-volver" aria-label="Volver al menú">← Volver</a>
            <h1 class="config-titulo">Configuración</h1>

            <div class="config-opciones">
                
                <div class="config-grupo">
                    <div class="grupo-titulo">Audio</div>
                    <div class="opcion">
                        <label for="volumen-general">Volumen general</label>
                        <input type="range" id="volumen-general" name="volumen-general" min="0" max="100" value="80">
                    </div>
                    <div class="opcion">
                        <label for="volumen-musica">Música</label>
                        <input type="range" id="volumen-musica" name="volumen-musica" min="0" max="100" value="70">
                    </div>
                    <div class="opcion">
                        <label for="volumen-efectos">Efectos de sonido</label>
                        <input type="range" id="volumen-efectos" name="volumen-efectos" min="0" max="100" value="70">
                    </div>
                </div>

                <div class="config-grupo">
                    <div class="grupo-titulo">Gráficos y Pantalla</div>
                    <div class="opcion opcion-toggle">
                        <label for="pantalla-completa">Pantalla completa</label>
                        <input type="checkbox" id="pantalla-completa" name="pantalla-completa">
                    </div>
                    <div class="opcion opcion-select">
                        <label for="calidad-grafica">Calidad Gráfica</label>
                        <select id="calidad-grafica" name="calidad-grafica">
                            <option value="alta" selected>Alta</option>
                            <option value="media">Media</option>
                            <option value="baja">Rendimiento</option>
                        </select>
                    </div>
                </div>

                <div class="config-grupo">
                    <div class="grupo-titulo">Juego</div>
                    <div class="opcion opcion-select">
                        <label for="idioma">Idioma</label>
                        <select id="idioma" name="idioma">
                            <option value="es" selected>Español</option>
                            <option value="en">English</option>
                        </select>
                    </div>
                    <div class="opcion opcion-toggle">
                        <label for="tutoriales">Mostrar tutoriales</label>
                        <input type="checkbox" id="tutoriales" name="tutoriales" checked>
                    </div>
                </div>

            </div>

            <a href="#" class="boton-guardar">Guardar cambios</a>
        </main>
    </div>
</body>
</html>
